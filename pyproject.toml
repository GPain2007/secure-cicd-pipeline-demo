[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort, S = bandit-style security rules,
# B = bugbear, UP = pyupgrade
select = ["E", "W", "F", "I", "S", "B", "UP"]
ignore = [
    "S101",   # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # test fixtures may use hardcoded values

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
skips = ["B101"]  # assert statements — acceptable in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80"

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*"]
