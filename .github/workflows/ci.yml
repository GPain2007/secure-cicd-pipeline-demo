name: CI — Lint · Test · Security

# Trigger on every push to any branch, and on PRs targeting main.
# This ensures every change passes all gates before it can be merged.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read # minimum needed to check out code
  security-events: write # required to upload SARIF results to GitHub Security tab

jobs:
  dependency-audit:
    name: SCA — dependency audit (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit runtime dependencies
        run: |
          pip-audit \
            --requirement requirements.txt \
            --fix --dry-run \
            --format markdown \
            --output pip-audit-report.md \
            || true   # surface findings without blocking; review report artifact

      - name: Audit dev dependencies
        run: |
          pip-audit \
            --requirement requirements-dev.txt \
            --fix --dry-run \
            --format markdown \
            --output pip-audit-dev-report.md \
            || true

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-reports
          path: "*.md"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 5 — Secret Scanning (Gitleaks)
  # Scans every committed file and the full git history for accidentally
  # committed secrets (API keys, tokens, passwords, private keys).
  # Runs on all jobs concurrently — no dependency on lint — so secrets are
  # flagged as fast as possible.
  # ────────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks can check every commit

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
