name: Lint Workflow

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read # minimum needed to check out code

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Run ruff
        run: |
          ruff check .
          ruff format --check .
